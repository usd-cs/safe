<html>
    <head>
        <title>Mock CAS Login (SAFE)</title>
    </head>
    <body>
        <h1>Mock CAS Login</h1>
        <form method="POST" action="">
            {{ form.csrf_token }}
            <p>{{ form.username.label }}: {{ form.username }}</p>

            <p>{{ form.password.label }}: {{ form.password }}</p>

            <p>{{ form.submit }}</p>
        </form>
    </body>
</html>
